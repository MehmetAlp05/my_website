// ===== GENEL: KÜÇÜK YARDIMCILAR =====

// Kimliği (id) verilen öğeyi bulur.
function $(kimlik) { return document.getElementById(kimlik); }

// Değeri alt ve üst sınır arasında tutar.
function sinirla(deger, enAz, enCok) { return Math.min(enCok, Math.max(enAz, deger)); }

// İki rengi verilen oranda karıştırır (0 → ilk renk, 1 → ikinci renk).
function renkKaristir(renk1, renk2, oran) {
  const sayilar = (renk) => [1, 3, 5].map((i) => parseInt(renk.slice(i, i + 2), 16));
  const a = sayilar(renk1);
  const b = sayilar(renk2);
  const karisim = a.map((deger, i) => Math.round(deger + (b[i] - deger) * oran));
  return '#' + karisim.map((d) => d.toString(16).padStart(2, '0')).join('');
}

// Birkaç rengin ortalamasını verir.
function renkOrtalamasi(renkler) {
  let ortalama = renkler[0];
  renkler.forEach((renk, i) => { if (i > 0) ortalama = renkKaristir(ortalama, renk, 1 / (i + 1)); });
  return ortalama;
}

// Bir adım canlanırken “baştan başla” denirse yarım kalan canlandırma IPTAL ile durur.
const IPTAL = new Error('iptal');
let tur = 0;                          // her baştan başlayışta artar
const canliAnimasyonlar = new Set();  // süren animasyonlar (iptal edilebilsin diye)

function bekle(ms, t) {
  return new Promise((coz, reddet) => setTimeout(() => (t === tur ? coz() : reddet(IPTAL)), ms));
}

async function animasyonuBekle(animasyon, t) {
  canliAnimasyonlar.add(animasyon);
  try {
    await animasyon.finished;
  } catch (hata) {
    throw IPTAL;
  } finally {
    canliAnimasyonlar.delete(animasyon);
  }
  if (t !== tur) throw IPTAL;
}

// ===== GENEL: EKRANA SIĞDIRMA =====
// Sayfa 1920×1080 için çizildi; pencere hangi boyuttaysa ona orantılı sığar.
function olcekle() {
  const olcek = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  $('sahne').style.setProperty('--olcek', olcek);
}
window.addEventListener('resize', olcekle);

// Bir öğenin ortasının, 1920×1080 sahnedeki yeri
function ogeninOrtasi(oge) {
  const sahne = $('sahne').getBoundingClientRect();
  const olcek = sahne.width / 1920;
  const kutu = oge.getBoundingClientRect();
  return {
    x: (kutu.left + kutu.width / 2 - sahne.left) / olcek,
    y: (kutu.top + kutu.height / 2 - sahne.top) / olcek,
  };
}

// Mutfak çizimindeki bir noktanın (SVG koordinatı), 1920×1080 sahnedeki yeri
function cizimNoktasi(x, y) {
  const sahne = $('sahne').getBoundingClientRect();
  const olcek = sahne.width / 1920;
  const kutu = $('mutfak').getBoundingClientRect();
  const cizimOlcegi = Math.min(kutu.width / 820, kutu.height / 820);
  const sol = kutu.left + (kutu.width - 820 * cizimOlcegi) / 2;
  const ust = kutu.top + (kutu.height - 820 * cizimOlcegi) / 2;
  return {
    x: (sol + x * cizimOlcegi - sahne.left) / olcek,
    y: (ust + y * cizimOlcegi - sahne.top) / olcek,
  };
}

  else if (tus === 'f') tamEkranDegistir();
  else return;
  olay.preventDefault();
});

// --- Tıklanacak şeyler ---
function adimHedefleri(adim) { return [].concat(adim.tikla); }

function hedefAdi(kimlik) {
  return VERI.malzemeler[kimlik] ? VERI.malzemeler[kimlik].ad : (VERI.araclar[kimlik] || kimlik);
}

function hedefOgesi(kimlik) {
  if (VERI.malzemeler[kimlik]) return document.querySelector(`#kiler [data-malzeme="${kimlik}"]`);
  // Aynı şeyin iki çizimi olabilir (ör. duvardaki ve ocaktaki tava): görünen seçilir
  const adaylar = [...document.querySelectorAll(`#mutfak [data-hedef="${kimlik}"]`)];
  return adaylar.find((oge) => !oge.classList.contains('gizli')) || adaylar[0];
}

// Raftaki malzemeye ✓ koyar (tarifte bir daha kullanılmayacaksa)
function kullanildiIsaretle(kimlik) {
  if (adimNo >= (sonKullanim[kimlik] ?? 0)) {
    const dugme = hedefOgesi(kimlik);
    if (dugme) dugme.classList.add('kullanildi');
  }
}

// --- Bir şeye tıklandı: doğru şeyse adımın eylemi canlanır ---
async function tiklandi(kimlik) {
  if (!tarif || calisiyor || adimNo >= tarif.adimlar.length) return;
  const adim = tarif.adimlar[adimNo];
  const hedefler = adimHedefleri(adim);
  // Yemek bir kabın içindeyse (ör. tavadaki hurmalar) kaba tıklamak yemeğe tıklamak sayılır
  if (!hedefler.includes(kimlik) && hedefler.includes('urun') && kimlik === urunYeri) kimlik = 'urun';
  if (!hedefler.includes(kimlik) || tiklananlar.includes(kimlik)) return;   // başka bir şeye tıklandı: yok sayılır

  const t = tur;
  calisiyor = true;
  tiklananlar.push(kimlik);
  adimiCiz();
  try {
    await EYLEMLER[adim.eylem](adim, kimlik, t);
  } catch (hata) {
    if (hata === IPTAL) return;    // bu arada baştan başlandı
    throw hata;
  }
  calisiyor = false;
  const adimBitti = adim.herhangi ? tiklananlar.length > 0 : hedefler.every((h) => tiklananlar.includes(h));
  if (adimBitti) {
    adimNo++;
    tiklananlar = [];
    if (adimNo === tarif.adimlar.length) bitir();
  }
  adimiCiz();
}

// --- Paneli ve parlayan şeyleri çizer ---
function adimiCiz() {
  const M = VERI.mutfak;
  const toplam = tarif.adimlar.length;
  const bitti = adimNo >= toplam;

  // İlerleme çubuğu: biten adımlar yeşil, şimdiki adım turuncu
  $('ilerleme').innerHTML = tarif.adimlar
    .map((_, i) => `<span class="${i < adimNo ? 'bitti' : i === adimNo ? 'simdi' : ''}"></span>`)
    .join('');

  document.querySelectorAll('.parla').forEach((oge) => oge.classList.remove('parla'));

  if (bitti) {
    $('adim-sayac').textContent = M.bittiBaslik;
    $('adim-yazi').innerHTML = M.bittiYazi;
    $('adim-tikla').innerHTML = '';
    $('kaynak-kutusu').hidden = true;
    $('adim-not').hidden = true;
    return;
  }

  const adim = tarif.adimlar[adimNo];
  const kalan = adimHedefleri(adim).filter((h) => !tiklananlar.includes(h));
  $('adim-sayac').textContent = `${M.adim} ${adimNo + 1} / ${toplam}`;
  $('adim-yazi').innerHTML = adim.yazi;
  $('kaynak-kutusu').hidden = !adim.kaynak;
  $('adim-kaynak').innerHTML = adim.kaynak || '';
  $('adim-not').hidden = !adim.not;
  $('adim-not').innerHTML = adim.not || '';

  if (!calisiyor) {
    $('adim-tikla').innerHTML = `${adim.herhangi ? M.birini : M.tikla} ${kalan.map(hedefAdi).join(', ')}`;
    kalan.forEach((h) => {
      const oge = hedefOgesi(h);
      if (oge) oge.classList.add('parla');
      if (h === 'urun' && KAPLAR[urunYeri]) hedefOgesi(urunYeri).classList.add('parla');   // içindeki kap da parlar
    });
  } else {
    $('adim-tikla').innerHTML = '';
  }
}

// Tarif bitti: kısa bir süre sonra sonuç kartı açılır

    if (!tarif) return;

// Bir malzeme simgesini sahnede bir noktadan ötekine uçurur; uçan simgeyi geri verir.
async function ucur(ikon, bas, son, t, olcek = { bas: 1, son: 0.5 }) {
  const ucan = document.createElement('div');
  ucan.className = 'ucan';
  ucan.innerHTML = svgIkon(ikon);
  ucan.style.left = bas.x + 'px';
  ucan.style.top = bas.y + 'px';
  $('sahne').appendChild(ucan);
  const animasyon = ucan.animate(
    [
      { transform: `translate(0px, 0px) scale(${olcek.bas})` },
      { transform: `translate(${son.x - bas.x}px, ${son.y - bas.y}px) scale(${olcek.son})` },
    ],
    { duration: 700, easing: 'ease-in-out', fill: 'forwards' }
  );
  await animasyonuBekle(animasyon, t);
  return ucan;
}

// Havandaki benekleri, macunu ve havaneliyi çizer
function havaniCiz() {
  const hedefRenk = tarif ? tarif.macunRengi : '#CBC796';
  for (const benek of havan.benekler) {
    const k = havan.karisim[benek.malzeme];
    benek.oge.setAttribute('cx', (benek.uzaklik * 48 * Math.cos(benek.aci)).toFixed(1));
    benek.oge.setAttribute('cy', (6 + benek.uzaklik * 19 * Math.sin(benek.aci)).toFixed(1));
    benek.oge.setAttribute('r', (benek.boyut * (1 + 0.4 * k)).toFixed(1));
    benek.oge.setAttribute('fill', renkKaristir(VERI.malzemeler[benek.malzeme].renk, hedefRenk, k));
    benek.oge.setAttribute('fill-opacity', (1 - 0.9 * k).toFixed(2));
  }

  // Macun: havandakilerin ortalama rengi; karıştıkça tarifin rengine döner, malzeme arttıkça büyür
  const icindekiler = Object.keys(havan.karisim);
  const macun = $('havan-macun');
  if (icindekiler.length) macun.setAttribute('fill', havanRengi());
  macun.style.transform = `scale(${icindekiler.length ? Math.min(1, 0.4 + 0.15 * icindekiler.length) : 0})`;

  // Havaneli: ucu havanın içinde küçük bir elips çizer
  const a = havan.aci;
  const uc = { x: 22 * Math.cos(a), y: 6 + 9 * Math.sin(a) };
  const sap = { x: uc.x + 42 + 6 * Math.cos(a), y: uc.y - 82 + 3 * Math.sin(a) };
  $('havaneli').setAttribute('x1', sap.x.toFixed(1));
  $('havaneli').setAttribute('y1', sap.y.toFixed(1));
  $('havaneli').setAttribute('x2', uc.x.toFixed(1));
  $('havaneli').setAttribute('y2', uc.y.toFixed(1));
  $('havaneli-bas').setAttribute('cx', uc.x.toFixed(1));
  $('havaneli-bas').setAttribute('cy', uc.y.toFixed(1));
}

// Havandaki karışımın şimdiki rengi
function havanRengi() {
  const icindekiler = Object.keys(havan.karisim);
  if (!icindekiler.length) return tarif.macunRengi;
  const ortalamaKarisim = icindekiler.reduce((toplam, k) => toplam + havan.karisim[k], 0) / icindekiler.length;
  const ortalamaRenk = renkOrtalamasi(icindekiler.map((k) => VERI.malzemeler[k].renk));
  return renkKaristir(ortalamaRenk, tarif.macunRengi, ortalamaKarisim);
}

// Havana bir malzeme düşer: kendi renginde benekler
function havanaEkle(kimlik) {
  havan.karisim[kimlik] = 0;
  const malzeme = VERI.malzemeler[kimlik];
  for (let i = 0; i < (malzeme.benek || 10); i++) {
    const daire = document.createElementNS(SVG_NS, 'circle');
    daire.setAttribute('class', 'benek');
    daire.style.animationDelay = (Math.random() * 0.2).toFixed(2) + 's';
    $('havan-benekler').appendChild(daire);
    havan.benekler.push({
      oge: daire,
      malzeme: kimlik,
      aci: Math.random() * 2 * Math.PI,
      uzaklik: 0.9 * Math.sqrt(Math.random()),   // 0 = havanın ortası, 1 = kenarı
      boyut: 2.5 + Math.random() * 2,
    });
  }
  havaniCiz();
}

// Havaneli döner, benekler karışır; karışım “hedef” değerine ulaşınca biter
function havanDov(hedef, sure, t) {
  const baslangicKarisim = { ...havan.karisim };
  const baslangic = performance.now();
  let onceki = baslangic;
  return new Promise((coz, reddet) => {
    const kare = (simdi) => {
      if (t !== tur) { reddet(IPTAL); return; }
      const fark = sinirla((simdi - onceki) / 1000, 0, 0.1);
      onceki = simdi;
      const oran = sinirla((simdi - baslangic) / sure, 0, 1);
      for (const k in havan.karisim) {
        const bas = baslangicKarisim[k] ?? 0;
        if (bas < hedef) havan.karisim[k] = bas + (hedef - bas) * oran;
      }
      havan.aci += fark * HAVANELI_HIZI;
      for (const benek of havan.benekler) benek.aci += fark * (1.2 - 0.7 * benek.uzaklik);   // ortadakiler daha hızlı döner
      havaniCiz();
      if (oran < 1) requestAnimationFrame(kare);
      else coz();
    };
    requestAnimationFrame(kare);
  });
}

// Tahtaya bir malzeme koyar (ör. soyulacak sarımsak)
function tahtayaKoy(malzeme, ikon) {
  tahtadaki = { malzeme, ikon };
  $('tahta-nesne').innerHTML = `<g transform="translate(0 -26) scale(0.52)">${IKONLAR[ikon]}</g>`;
}

// Bir kabın şimdiki yeri (tabanının ortası)
function kapNoktasi(kap) {
  const yer = kapYerleri[kap] || 'ev';
  return yer === 'ev' ? KAPLAR[kap].ev : KAP_YERLERI[yer];
}

// Bir kabı bir yere koyar ('ev' = dinlenme yeri)
function kabiYerlestir(kap, yer) {
  kapYerleri[kap] = yer;
  const nokta = kapNoktasi(kap);
  const olcek = yer === 'discus' ? 0.8 : 1;
  $('kap-' + kap).style.transform = `translate(${nokta.x}px, ${nokta.y}px) scale(${olcek})`;
  if (kap === 'sartago') {
    // Duvardaki tava (önden görünüş) ile ocaktaki tava (yandan görünüş) yer değiştirir
    const askida = yer === 'ev';
    $('arac-sartago').classList.toggle('gizli', !askida);
    $('sartago-etiketi').classList.toggle('gizli', !askida);
    $('kap-sartago').classList.toggle('gizli', askida);
  }
}

// Yemeğin bir yerdeki konumu ve boyutu: bir kabın içi, tahta, ocağın kenarı, havan ya da servis tepsisi
function urunNoktasi(yer) {
  if (KAPLAR[yer]) {
    const nokta = kapNoktasi(yer);
    const ic = KAPLAR[yer].ic;
    return { x: nokta.x, y: nokta.y + ic.dy, olcek: ic.olcek };
  }
  const nokta = YER[yer];
  const olcek = yer === 'discus' ? 0.75 : yer === 'havan' ? 0.5 : 1;
  return { x: nokta.x, y: nokta.y, olcek };
}

// Yemeği bir yere koyar (geçişle kayarak)
function urunuYerlestir(yer, olcek) {
  const nokta = urunNoktasi(yer);
  $('urun').style.transform = `translate(${nokta.x}px, ${nokta.y}px) scale(${olcek ?? nokta.olcek})`;
  urunYeri = yer;
}

// Yemeği bir yerde hemen belirtir (kaymadan, yavaşça görünerek)
function urunuGoster(yer) {
  const urun = $('urun');
  urun.classList.add('gecissiz');
  urunuYerlestir(yer);
  urun.getBoundingClientRect();
  urun.classList.remove('gecissiz');
  urun.classList.remove('gizli');
}

// Bir malzemenin uçacağı nokta (sahne koordinatı)
function eklemeNoktasi(kap) {
  if (kap === 'havan') return cizimNoktasi(YER.havan.x, YER.havan.y);
  if (kap === 'urun') {
    const nokta = urunNoktasi(urunYeri);
    return cizimNoktasi(nokta.x, nokta.y - 14);
  }
  if (KAPLAR[kap]) {
    const nokta = kapNoktasi(kap);
    return cizimNoktasi(nokta.x, nokta.y + KAPLAR[kap].agiz);
  }
  return cizimNoktasi(YER[kap].x, YER[kap].y - 20);
}

// Bir kabın içindekinin rengini değiştirir (renk yavaşça geçer)
function icerikRengiVer(kap, renk) {
  icerikRenkleri[kap] = renk;
  $('icerik-' + kap).style.fill = renk;
}

// Bir kabın içine sıvı, yağ ya da baharat konur (ör. tavada bal); kapta bir şey varsa renkler karışır
function kabaDoldur(kap, malzeme) {
  const icerik = $('icerik-' + kap);
  const renk = VERI.malzemeler[malzeme].renk;
  const dolu = icerik.style.display !== 'none' && icerikRenkleri[kap];
  icerikRengiVer(kap, dolu ? renkKaristir(icerikRenkleri[kap], renk, 0.3) : renk);
  icerik.style.display = '';
}

// Bir kabın üstünde kısa süre ölçü yazar (ör. “6 sextarius ≈ 3 litre”)
async function olcuGoster(yazi, kap, t) {
  const nokta = kapNoktasi(kap);
  const etiket = $('olcu-etiketi');
  $('olcu-yazisi').textContent = yazi;
  const genislik = $('olcu-yazisi').getComputedTextLength() + 36;
  const sol = sinirla(nokta.x - genislik / 2, 10, 810 - genislik);
  const ust = nokta.y + KAPLAR[kap].agiz - 110;
  $('olcu-kutu').setAttribute('width', genislik);
  $('olcu-yazisi').setAttribute('x', genislik / 2);
  etiket.setAttribute('transform', `translate(${sol} ${ust})`);
  etiket.style.opacity = 1;
  try {
    await bekle(1400, t);
  } finally {
    etiket.style.opacity = 0;
  }
}

// Bir aleti iş sırasında her şeyin önüne alır; iş bitince yerine koyar
async function oneAlarak(oge, islem) {
  const ebeveyn = oge.parentNode;
  const sonraki = oge.nextSibling;
  $('mutfak').appendChild(oge);
  try {
    await islem();
  } finally {
    ebeveyn.insertBefore(oge, sonraki);
  }
}

// Pişme, kaynama ya da kızarma süreci: buhar ve kabarcıklar çıkar, paneldeki çubuk dolar
async function pismeSureci({ yazi, sure, nokta, kabarcik }, t) {
  const buhar = $('buhar');
  const kabarciklar = $('kabarcik');
  if (nokta) {
    buhar.setAttribute('transform', `translate(${nokta.x} ${nokta.y})`);
    buhar.style.display = '';
  }
  if (kabarcik) {
    kabarciklar.setAttribute('transform', `translate(${kabarcik.x} ${kabarcik.y})`);
    kabarciklar.style.display = '';
  }
  $('adim-tikla').innerHTML = `${yazi}<div class="surec"><div id="surec-dolgu"></div></div>`;
  const dolma = $('surec-dolgu').animate([{ width: '0%' }, { width: '100%' }], { duration: sure * 1000, fill: 'forwards' });
  try {
    await animasyonuBekle(dolma, t);
  } finally {
    buhar.style.display = 'none';
    kabarciklar.style.display = 'none';
  }
}

// Bir kabın ağzının üstündeki buhar ve kabarcık yerleri
function kapAgzi(kap) {
  const nokta = kapNoktasi(kap);
  const agiz = nokta.y + KAPLAR[kap].agiz;
  return { nokta: { x: nokta.x, y: agiz - 12 }, kabarcik: kap === 'patina' ? null : { x: nokta.x, y: agiz } };
}

// Kısa süren bir efekt animasyonu (iptal edilebilsin diye kaydedilir)
function efektAnimasyonu(oge, kareler, secenekler) {
  const animasyon = oge.animate(kareler, secenekler);
  canliAnimasyonlar.add(animasyon);
  animasyon.finished.then(() => canliAnimasyonlar.delete(animasyon), () => {});
  return animasyon;
}

// Bıçak işlerken çekirdekler ve saplar yemekten fırlar
function cekirdekFirlat() {
  const nokta = urunNoktasi(urunYeri);
  PARCALAR[urunTuru].araliklar.forEach((x, i) => {
    for (let j = 0; j < 2; j++) {
      const cekirdek = document.createElementNS(SVG_NS, 'ellipse');
      cekirdek.setAttribute('cx', (nokta.x + x * nokta.olcek).toFixed(1));
      cekirdek.setAttribute('cy', (nokta.y - 14).toFixed(1));
      cekirdek.setAttribute('rx', 3.5);
      cekirdek.setAttribute('ry', 2);
      cekirdek.setAttribute('fill', '#3A1E12');
      $('efekt').appendChild(cekirdek);
      const yon = (i + j) % 2 ? 1 : -1;
      efektAnimasyonu(cekirdek,
        [{ transform: 'translate(0px, 0px)', opacity: 1 },
         { transform: `translate(${yon * 22}px, -26px)`, opacity: 1, offset: 0.4 },
         { transform: `translate(${yon * 44}px, 10px)`, opacity: 0 }],
        { duration: 900, delay: j * 120, easing: 'ease-out', fill: 'forwards' });
    }
  });
}

// Süzgeçten kadehe damlalar düşer
function damlaDok(bas, sonY, renk) {
  for (let i = 0; i < 10; i++) {
    const damla = document.createElementNS(SVG_NS, 'ellipse');
    damla.setAttribute('cx', (bas.x + (Math.random() - 0.5) * 14).toFixed(1));
    damla.setAttribute('cy', bas.y);
    damla.setAttribute('rx', 2);
    damla.setAttribute('ry', 3.5);
    damla.setAttribute('fill', renk);
    damla.setAttribute('opacity', 0);
    $('efekt').appendChild(damla);
    efektAnimasyonu(damla,
      [{ transform: 'translate(0px, 0px)', opacity: 1 }, { transform: `translate(0px, ${sonY - bas.y}px)`, opacity: 0.7 }],
      { duration: 450, delay: i * 140, easing: 'ease-in' });
  }
}

// Tuz, karabiber ya da haşhaş taneleri bir noktanın üstüne düşer
function taneDok(nokta, renk) {
  for (let i = 0; i < 16; i++) {
    const tane = document.createElementNS(SVG_NS, 'circle');
    tane.setAttribute('cx', (nokta.x + (Math.random() - 0.5) * 70).toFixed(1));
    tane.setAttribute('cy', (nokta.y - 46).toFixed(1));
    tane.setAttribute('r', 2);
    tane.setAttribute('fill', renk);
    $('efekt').appendChild(tane);
    efektAnimasyonu(tane,
      [{ transform: 'translate(0px, 0px)', opacity: 1 }, { transform: `translate(0px, ${(40 + Math.random() * 8).toFixed(0)}px)`, opacity: 0.9 }],
      { duration: 600, delay: Math.random() * 300, easing: 'ease-in', fill: 'forwards' });
  }
}

// Kil kapağı askıya ya da yemeğin üstüne koyar
function kapagiYerlestir() {
  const nokta = kapakYeri === 'aski' ? YER.kapakAskisi : YER[kapakYeri];
  $('arac-testum').style.transform = `translate(${nokta.x}px, ${nokta.y}px)`;
}

// Sarımsak kabukları tahtadan dökülür
function kabukDok() {
  for (let i = 0; i < 8; i++) {
    const kabuk = document.createElementNS(SVG_NS, 'ellipse');
    kabuk.setAttribute('cx', (YER.tahta.x + (Math.random() - 0.5) * 30).toFixed(1));
    kabuk.setAttribute('cy', (YER.tahta.y - 20 - Math.random() * 16).toFixed(1));
    kabuk.setAttribute('rx', 6);
    kabuk.setAttribute('ry', 3);
    kabuk.setAttribute('fill', '#EFE6D2');
    kabuk.setAttribute('stroke', '#C9B99B');
    kabuk.style.transformBox = 'fill-box';
    kabuk.style.transformOrigin = 'center';
    $('efekt').appendChild(kabuk);
    const animasyon = kabuk.animate(
      [
        { transform: 'translate(0px, 0px) rotate(0deg)', opacity: 1 },
        { transform: `translate(${((Math.random() - 0.5) * 90).toFixed(0)}px, ${(18 + Math.random() * 20).toFixed(0)}px) rotate(${(Math.random() * 180).toFixed(0)}deg)`, opacity: 0 },
      ],
      { duration: 900, easing: 'ease-out', fill: 'forwards' }
    );
    canliAnimasyonlar.add(animasyon);
    animasyon.finished.then(() => canliAnimasyonlar.delete(animasyon), () => {});
  }
}

// ===== EKRAN 2: ADIMLARIN EYLEMLERİ =====
// Her eylem bir adımın canlandırmasıdır. VERI'deki adımlarda "eylem" olarak bu adlar kullanılır.
const EYLEMLER = {

  // Raftaki (ya da tahtadaki) malzemeyi havana ya da yemeğin altına koyar; istenirse önce kantarda tartar.
  async ekle(adim, kimlik, t) {
    let malzeme = kimlik;
    let ikon = kimlik;
    let bas;
    if (kimlik === 'tahta') {
      malzeme = tahtadaki.malzeme;
      ikon = tahtadaki.ikon;
      bas = cizimNoktasi(YER.tahta.x, YER.tahta.y - 26);
      tahtadaki = null;
      $('tahta-nesne').innerHTML = '';
    } else {
      const dugme = hedefOgesi(kimlik);
      bas = ogeninOrtasi(dugme.querySelector('svg'));
      kullanildiIsaretle(kimlik);
    }
    let olcek = kimlik === 'tahta' ? 0.62 : 1;

    // Kantar: önce kefeye uçar, miktar görünür, kantar hafifçe sallanır
    if (adim.tart) {
      const kefe = cizimNoktasi(YER.kefe.x, YER.kefe.y - 14);
      const tartilan = await ucur(ikon, bas, kefe, t, { bas: olcek, son: 0.6 });
      $('tarti-yazisi').textContent = adim.tart;
      $('tarti-etiketi').style.opacity = 1;
      const sallanma = $('statera-kol').animate(
        [{ transform: 'rotate(0deg)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(3deg)' }, { transform: 'rotate(0deg)' }],
        { duration: 1200, easing: 'ease-in-out' }
      );
      canliAnimasyonlar.add(sallanma);
      try {
        await bekle(1500, t);
      } finally {
        canliAnimasyonlar.delete(sallanma);
        tartilan.remove();
      }
      $('tarti-etiketi').style.opacity = 0;
      bas = kefe;
      olcek = 0.6;
    }

    const ucan = await ucur(ikon, bas, eklemeNoktasi(adim.kap), t, { bas: olcek, son: 0.5 });
    ucan.remove();
    if (adim.kap === 'havan') havanaEkle(malzeme);
    else if (adim.kap === 'urun') $('urun-yaprak').style.display = '';   // yemek yaprakların üstüne konur
    else if (PARCALAR[malzeme]) {                                          // ör. armutlar tencereye, hurmalar ya da et tahtaya
      urunuKur(malzeme);
      urunuGoster(adim.kap);
    } else kabaDoldur(adim.kap, malzeme);                                   // ör. tavaya bal, kaba yağ

    // Sıvı ölçüsü ya da baharat miktarı kabın üstünde görünür
    const olcu = adim.olcu || (adim.olculer && adim.olculer[kimlik]);
    if (olcu && KAPLAR[adim.kap]) await olcuGoster(olcu, adim.kap, t);
    if (adim.icerikRengi) icerikRengiVer(adim.kap, adim.icerikRengi);     // ör. kömürle berraklaşır

    // İstenirse kap ateşteyken içindeki kaynar
    if (adim.kaynat) {
      const agiz = kapAgzi(adim.kap);
      await pismeSureci({ yazi: VERI.mutfak.kaynaniyor, sure: VERI.mutfak.kaynatmaSuresi, ...agiz }, t);
    }
  },

  // Malzemeyi tahtada soyar (sarımsak)
  async soy(adim, kimlik, t) {
    const dugme = hedefOgesi(kimlik);
    kullanildiIsaretle(kimlik);
    const ucan = await ucur(kimlik, ogeninOrtasi(dugme.querySelector('svg')), cizimNoktasi(YER.tahta.x, YER.tahta.y - 26), t, { bas: 1, son: 0.62 });
    ucan.remove();
    tahtayaKoy(kimlik, kimlik);
    await bekle(250, t);
    kabukDok();
    await bekle(900, t);
    $('efekt').innerHTML = '';
    tahtayaKoy(kimlik, SOYULMUS_IKON[kimlik] || kimlik);
  },

  // Havanda döver ya da karıştırır
  async dov(adim, kimlik, t) {
    await havanDov(adim.karisim, 2200, t);
  },

  // Havandaki karışımdan tahtada somun ya da top yapar
  async sekillendir(adim, kimlik, t) {
    const urun = $('urun');
    $('havan-icerik').classList.add('bos');
    urunuKur(adim.parca || tarif.urun);
    urun.classList.add('gecissiz');
    urun.style.setProperty('--hamur', havanRengi());
    urunuYerlestir('tahta', 0.3);
    urun.getBoundingClientRect();
    urun.classList.remove('gecissiz');
    urun.classList.remove('gizli');
    urunuYerlestir('tahta');
    await bekle(800, t);
  },

  // Yemeği başka bir yere taşır (ör. ocağın kenarına)
  async tasi(adim, kimlik, t) {
    urunuYerlestir(adim.yer);
    await bekle(800, t);
    if (adim.yer === 'havan') {          // havana giren yemek (ör. armutlar) dövülecek malzemeye dönüşür
      $('urun').classList.add('gizli');
      havanaEkle(urunTuru);
    }
  },

  // Kil kapağı askıdan alıp yemeğin üstüne kapatır
  async kapak(adim, kimlik, t) {
    kapakYeri = urunYeri;
    kapagiYerlestir();
    $('testum-etiketi').style.opacity = 0;
    await bekle(900, t);
  },

  // Ateşten kor alıp kapağın üstüne ve etrafına yığar
  async kor(adim, kimlik, t) {
    const kapak = YER[kapakYeri];
    const yerler = [[-88, -6], [88, -6], [-36, -82], [0, -98], [36, -82], [-62, -40], [62, -40]];
    const animasyonlar = yerler.map(([dx, dy], i) => {
      const kor = document.createElementNS(SVG_NS, 'circle');
      kor.setAttribute('cx', YER.koz.x);
      kor.setAttribute('cy', YER.koz.y);
      kor.setAttribute('r', 7);
      kor.setAttribute('fill', i % 2 ? '#F2A541' : '#D9622B');
      $('efekt').appendChild(kor);
      return kor.animate(
        [{ transform: 'translate(0px, 0px)' }, { transform: `translate(${kapak.x + dx - YER.koz.x}px, ${kapak.y + dy - YER.koz.y}px)` }],
        { duration: 650, delay: i * 90, easing: 'ease-in-out', fill: 'forwards' }
      );
    });
    for (const animasyon of animasyonlar) await animasyonuBekle(animasyon, t);
    $('efekt').innerHTML = '';
    $('arac-testum').classList.add('korlu');
    await bekle(300, t);
  },

  // Yemek pişer: buhar çıkar, paneldeki çubuk dolar
  async pisir(adim, kimlik, t) {
    // İstenirse önce kap ateşe konur (ör. patina ızgaraya)
    if (adim.kap && adim.yer) {
      kabiYerlestir(adim.kap, adim.yer);
      await bekle(800, t);
    } else if (adim.yer) {                 // ör. köfteler ızgaraya konur
      urunuYerlestir(adim.yer);
      await bekle(800, t);
    }
    let yerler;
    if (adim.kap) yerler = kapAgzi(adim.kap);
    else if (kapakYeri !== 'aski') {
      const yer = YER[kapakYeri];
      yerler = { nokta: { x: yer.x, y: yer.y - 105 }, kabarcik: null };
    } else {
      const yer = urunNoktasi(urunYeri);
      yerler = { nokta: { x: yer.x, y: yer.y - 30 }, kabarcik: null };
    }
    if (adim.renk) $('urun').style.setProperty('--hamur', adim.renk);   // ör. somun kızarır
    if (adim.durum) $('urun').classList.add(adim.durum);                 // ör. armutlar haşlanır
    if (adim.icerikRengi) icerikRengiVer(adim.kap, adim.icerikRengi);    // ör. patina katılaşır
    if (adim.kopuk) $('kopuk-' + adim.kap).style.display = '';           // kaynarken köpürür
    await pismeSureci({ yazi: adim.bekleme || VERI.mutfak.pisiyor, sure: VERI.mutfak.pismeSuresi, ...yerler }, t);
  },

  // Kapak varsa kaldırılır; yemek servis tepsisine (discus) alınır
  async servis(adim, kimlik, t) {
    if (kapakYeri !== 'aski') {
      kapakYeri = 'aski';
      kapagiYerlestir();
      $('arac-testum').classList.remove('korlu');
      await bekle(900, t);
      $('testum-etiketi').style.opacity = 1;
    }
    if (tarif.servisKabi) kabiYerlestir(tarif.servisKabi, 'discus');   // ör. patina tavasıyla servis edilir
    else urunuYerlestir('discus');
    await bekle(900, t);
  },

  // Bir kabı ocağa koyar (ör. tencereyi közün üstüne)
  async kapKoy(adim, kimlik, t) {
    kabiYerlestir(adim.kap, adim.yer);
    await bekle(800, t);
    if (adim.kopukAl) $('kopuk-' + adim.kap).style.display = 'none';   // köpüğü alınır
  },

  // Yemeği ateşteki kaba alır ve kızartır
  async kizart(adim, kimlik, t) {
    urunuYerlestir(adim.kap);
    await bekle(800, t);
    if (adim.renk) $('urun').style.setProperty('--hamur', adim.renk);
    await pismeSureci({ yazi: VERI.mutfak.kizariyor, sure: VERI.mutfak.kizartmaSuresi, ...kapAgzi(adim.kap) }, t);
    if (adim.durum) $('urun').classList.add(adim.durum);
  },

  // İki çubukla kaptaki yemeği çevirir
  async cevir(adim, kimlik, t) {
    const agiz = kapAgzi(adim.kap);
    const dx = agiz.nokta.x - CUBUK_UCU.x;
    const dy = agiz.nokta.y + 16 - CUBUK_UCU.y;
    const hareket = efektAnimasyonu($('arac-cubuklar'), [
      { transform: 'translate(0px, 0px)' },
      { transform: `translate(${dx}px, ${dy}px)`, offset: 0.25 },
      { transform: `translate(${dx - 10}px, ${dy}px)`, offset: 0.38 },
      { transform: `translate(${dx + 10}px, ${dy}px)`, offset: 0.5 },
      { transform: `translate(${dx - 10}px, ${dy}px)`, offset: 0.62 },
      { transform: `translate(${dx}px, ${dy}px)`, offset: 0.75 },
      { transform: 'translate(0px, 0px)' },
    ], { duration: 2600, easing: 'ease-in-out' });
    efektAnimasyonu($('urun-ogeler'), [
      { transform: 'translate(0px, 0px)' }, { transform: 'translate(0px, -4px)', offset: 0.45 },
      { transform: 'translate(0px, 0px)', offset: 0.55 }, { transform: 'translate(0px, -4px)', offset: 0.65 },
      { transform: 'translate(0px, 0px)' },
    ], { duration: 2600 });
    if (adim.renk) $('urun').style.setProperty('--hamur', adim.renk);
    await Promise.all([
      animasyonuBekle(hareket, t),
      pismeSureci({ yazi: VERI.mutfak.kizariyor, sure: 2.6, ...agiz }, t),
    ]);
  },

  // Bıçakla çekirdek ya da öz çıkarır
  async kes(adim, kimlik, t) {
    const nokta = urunNoktasi(urunYeri);
    const dx = nokta.x - BICAK_UCU.x;
    const dy = nokta.y - 34 - BICAK_UCU.y;
    // Bıçak çalışırken her şeyin önünde görünsün; iş bitince duvardaki yerine döner
    await oneAlarak($('arac-culter'), () => bicakla(dx, dy, adim, t));
  },

  // Yemeğin içine dolgu koyar (birkaç seçenekten biri)
  async doldur(adim, kimlik, t) {
    const dugme = hedefOgesi(kimlik);
    kullanildiIsaretle(kimlik);
    const ucan = await ucur(kimlik, ogeninOrtasi(dugme.querySelector('svg')), eklemeNoktasi('urun'), t, { bas: 1, son: 0.5 });
    ucan.remove();
    $('urun').style.setProperty('--dolgu', VERI.malzemeler[kimlik].renk);
    $('urun').classList.add('dolu', 'dolu-' + kimlik);
    await bekle(300, t);
  },

  // Tuz, karabiber ya da haşhaş serper (yemeğin ya da patinanın üstüne)
  async serp(adim, kimlik, t) {
    const dugme = hedefOgesi(kimlik);
    kullanildiIsaretle(kimlik);
    let nokta;
    if (adim.hedef === 'patina') {
      const kap = kapNoktasi('patina');
      nokta = { x: kap.x, y: kap.y + KAPLAR.patina.agiz };
    } else {
      const urun = urunNoktasi(urunYeri);
      nokta = { x: urun.x, y: urun.y - 14 * urun.olcek };
    }
    const ucan = await ucur(kimlik, ogeninOrtasi(dugme.querySelector('svg')), cizimNoktasi(nokta.x, nokta.y - 56), t, { bas: 1, son: 0.45 });
    taneDok(nokta, VERI.malzemeler[kimlik].renk);
    try {
      await bekle(900, t);
    } finally {
      ucan.remove();
    }
    $('efekt').innerHTML = '';
    if (adim.hedef === 'patina') $('patina-biber').style.display = '';
    else $('urun').classList.add(adim.durum);
  },

  // Yemeğin üstüne bal sürer
  async sur(adim, kimlik, t) {
    const dugme = hedefOgesi(kimlik);
    kullanildiIsaretle(kimlik);
    const ucan = await ucur(kimlik, ogeninOrtasi(dugme.querySelector('svg')), eklemeNoktasi('urun'), t, { bas: 1, son: 0.5 });
    ucan.remove();
    $('urun').classList.add(adim.durum);
    await bekle(300, t);
  },

  // Havandaki karışımı sığ tavaya (patina) döker
  async dok(adim, kimlik, t) {
    kabiYerlestir('patina', 'tahta');
    await bekle(800, t);
    const icerik = $('icerik-patina');
    icerik.classList.add('gecissiz');
    icerikRengiVer('patina', havanRengi());
    icerik.getBoundingClientRect();
    icerik.classList.remove('gecissiz');
    icerik.style.display = '';
    $('havan-icerik').classList.add('bos');
    const dolma = icerik.animate([{ transform: 'scale(0.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 700, easing: 'ease-out' });
    await animasyonuBekle(dolma, t);
  },

  // Bir gece bekletir: kap ateşteyse kenara alınır, mutfak kısa bir süre kararıp aydınlanır
  async gece(adim, kimlik, t) {
    if (adim.kap && kapYerleri[adim.kap] === 'koz') {
      kabiYerlestir(adim.kap, 'kenar');
      await bekle(800, t);
    }
    const karartma = efektAnimasyonu($('gece'),
      [{ opacity: 0 }, { opacity: 0.6, offset: 0.3 }, { opacity: 0.6, offset: 0.7 }, { opacity: 0 }],
      { duration: VERI.mutfak.geceSuresi * 1000 });
    await Promise.all([
      animasyonuBekle(karartma, t),
      pismeSureci({ yazi: VERI.mutfak.gece, sure: VERI.mutfak.geceSuresi, nokta: null }, t),
    ]);
  },

  // Tenceredekini süzgeçten (colum) geçirip servis tepsisindeki kadehe süzer
  async suz(adim, kimlik, t) {
    const renk = icerikRenkleri.olla || '#7A3A2A';
    urunuKur(tarif.urun);
    $('urun').style.setProperty('--kadeh', renk);
    urunuGoster('discus');
    const hedef = { x: YER.discus.x, y: YER.discus.y - 66 };   // süzgecin altı kadehin biraz üstünde durur
    const dx = hedef.x - SUZGEC_ALTI.x;
    const dy = hedef.y - SUZGEC_ALTI.y;
    await oneAlarak($('arac-colum'), async () => {
      const hareket = efektAnimasyonu($('arac-colum'), [
        { transform: 'translate(0px, 0px)' },
        { transform: `translate(${dx}px, ${dy}px)`, offset: 0.25 },
        { transform: `translate(${dx}px, ${dy}px)`, offset: 0.8 },
        { transform: 'translate(0px, 0px)' },
      ], { duration: 3400, easing: 'ease-in-out' });
      await bekle(900, t);
      damlaDok(hedef, YER.discus.y - 30, renk);
      await pismeSureci({ yazi: VERI.mutfak.suzuluyor, sure: 1.6, nokta: null }, t);
      $('urun').classList.add('dolu');
      await animasyonuBekle(hareket, t);
      $('efekt').innerHTML = '';
    });
  },
};

// Bıçak tahtaya iner, iki kez keser, çekirdekler fırlar, sonra duvara döner
async function bicakla(dx, dy, adim, t) {
  const hareket = efektAnimasyonu($('arac-culter'), [
    { transform: 'translate(0px, 0px)' },
    { transform: `translate(${dx}px, ${dy}px)`, offset: 0.3 },
    { transform: `translate(${dx}px, ${dy + 16}px)`, offset: 0.42 },
    { transform: `translate(${dx}px, ${dy}px)`, offset: 0.54 },
    { transform: `translate(${dx}px, ${dy + 16}px)`, offset: 0.66 },
    { transform: `translate(${dx}px, ${dy}px)`, offset: 0.78 },
    { transform: 'translate(0px, 0px)' },
  ], { duration: 2200, easing: 'ease-in-out' });
  await bekle(1000, t);
  if (adim.firlat !== false) cekirdekFirlat();   // et doğranırken çekirdek fırlamaz
  $('urun').classList.add(adim.durum);
  await animasyonuBekle(hareket, t);
  $('efekt').innerHTML = '';
}
